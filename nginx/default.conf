# OrbStack принимает https и проксирует сюда по http с X-Forwarded-Proto. На сервере nginx
# ISPmanager сам принимает https и отдаёт PHP HTTPS=on — делаем так же, иначе Laravel считает
# запрос http: ссылки получаются http://, подписанные ссылки не сходятся.
map $http_x_forwarded_proto $studio_https {
    default "";
    https   on;
}

server {
    listen 80 default_server;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Как на сервере студии: загрузки до 10 МБ, с запасом на поля формы (post_max_size = 12M)
    client_max_body_size 12m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Выполняется только фронт-контроллер Laravel; другие .php в public — 404
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php-fpm:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $studio_https if_not_empty;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
