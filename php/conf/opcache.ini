; Разработка: правка файла видна со следующего запроса (validate_timestamps, revalidate_freq=0).
opcache.enable = 1
; В CLI кэш живёт один процесс artisan — только тратит время на сохранение
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1
; JIT несовместим с Xdebug и в разработке не нужен
opcache.jit = "disable"
