; Как на сервере студии: загрузки до 10 МБ (с запасом на поля формы), часовой пояс Алматы.
; Сайту нужно другое — свой файл в /usr/local/etc/php/conf.d/zzz-site.ini через volume.
[PHP]
memory_limit = 512M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 120
max_input_vars = 5000
expose_php = Off

; Код смонтирован с macOS: без кэша путей каждый include заново спрашивает файловую систему
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Date]
date.timezone = Asia/Almaty
