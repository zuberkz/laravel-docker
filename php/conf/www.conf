; Поверх пула официального образа (www.conf, zz-docker.conf: listen 9000, daemonize no).
[www]
; Livewire, Filament и Vite шлют запросы пачками: пяти процессов не хватало
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

request_terminate_timeout = 120s

; Журнал запросов дублирует nginx и шумит на каждый запрос; ошибки PHP идут в stderr контейнера
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
